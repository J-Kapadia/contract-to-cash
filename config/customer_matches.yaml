# Reviewed customer matches: one decision per doubt-band pair.
#
# Each entry is {a, b, decision, reason}: `a` and `b` are the two source customer ids,
# `decision` is `same` or `different`, `reason` is the reviewer's one-line reason.
# The file is hashed for sign-off; any edit after signing must be signed again.
#
# These are the doubt-band pairs of the full books, listed with the sources, score and rules
# that placed them there. Every decision is empty and every reason blank until the reviewer
# fills them in, and the loader rejects an empty decision, so nothing reads this file as it
# stands: set `decision` to `same` or `different` and write the one-line reason for each pair.
pairs:
