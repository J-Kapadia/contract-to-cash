name: c2c
version: "0.1.0"
config-version: 2
profile: c2c

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# The as-of date of a forecast build; a plain close builds no forecast model, so the default
# only lets the project parse.
vars:
  as_of: "9999-12-31"

models:
  c2c:
    +materialized: table
    staging:
      +schema: int
    intermediate:
      +schema: int
    marts:
      +schema: mart
    forecast:
      +tags: ['forecast']
      +schema: fc_build
      +materialized: view
