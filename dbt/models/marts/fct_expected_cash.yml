version: 2

models:
  - name: fct_expected_cash
    description: >
      Expected cash per open invoice per month-end and case. Each invoice open at the end of a month
      has a row for base (median days to pay), downside (80th percentile) and upside (the lesser of the
      median and the terms), dated by expected_pay_date() on a business day. An invoice more than the
      policy's days past due is at risk: its base and upside cents are 0 and its downside row keeps the
      open amount.
    columns:
      - name: month
        data_tests: [not_null]
      - name: invoice_id
        data_tests: [not_null]
      - name: customer_id
        description: Null for an invoice whose customer has no CRM account, so the close can name the cluster.
      - name: case
        quote: true
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [base, downside, upside]
      - name: expected_date
        data_tests: [not_null]
      - name: cents
        data_tests: [not_null]
      - name: at_risk
        data_tests: [not_null]
